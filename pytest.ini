[pytest]
# Limita la recolección a la carpeta oficial de tests
testpaths = tests

# Opciones por defecto (las flags de cobertura se pasan por CLI)
addopts = --maxfail=1 --disable-warnings

# Evita recursión en carpetas no relevantes o pesadas
norecursedirs = 
    .git 
    __pycache__ 
    archive 
    data 
    database 
    logs 
    mlruns 
    storage 
    web

# Descubrimiento estándar
python_files = test_*.py
asyncio_mode = auto

services:
  redis:
    image: "redis:alpine"
    container_name: itbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    networks:
      - bot_network

  db:
    image: postgres:16-alpine # Using Alpine for smaller image size
    container_name: itbot_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Explicitly set password from .env
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent data storage
    ports:
      - "5432:5432" # Optional: Expose port to host for direct access (e.g., for pgAdmin)
    networks:
      - bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  listener:
    container_name: itbot_listener
    build: .
    command: python main.py
    env_file:
      - .env
    volumes:
      - data-volume:/app/data
      - logs-volume:/app/logs
      - storage-volume:/app/storage
      - ./assets:/app/assets:ro
    depends_on:
      - redis
      - db # Add dependency on PostgreSQL
    restart: unless-stopped
    mem_limit: 1g
    environment: # Pass PostgreSQL and Redis connection details to the bot
      POSTGRES_HOST: db # Service name of the PostgreSQL container
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis # Explicitly set Redis host for inter-container communication
      # Ruta opcional a un banner para mostrar en Telegram (/app/...)
      BANNER_IMAGE_PATH: "/app/assets/logo.png"
  # Secrets (store in .env, do NOT commit):
  # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  # TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
  # ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
  # BINANCE_API_KEY: ${BINANCE_API_KEY}
  # BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
    networks:
      - bot_network

  bot:
    container_name: itbot_main
    build: .
    command: python run_bot.py
    env_file:
      - .env
    volumes:
      - data-volume:/app/data
      - logs-volume:/app/logs
      - storage-volume:/app/storage
      - ./data/analisis:/app/data/analisis
      - ./data/dynamic_system:/app/data/dynamic_system
    depends_on:
      - redis
      - db
      - listener
    restart: unless-stopped
    mem_limit: 2g # Más memoria para el análisis dinámico
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      # Controla modo producción / paper trading desde .env (default: false -> paper)
      PRODUCTION_MODE: "${PRODUCTION_MODE:-false}"
      DYNAMIC_PAIR_SELECTION_ENABLED: "true"
    # Secrets (store in .env, do NOT commit):
    # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    # TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    # BINANCE_API_KEY: ${BINANCE_API_KEY}
    # BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY}
    networks:
      - bot_network

  worker:
    container_name: itbot_worker
    build: .
    command: python execution_worker.py
    env_file:
      - .env
    volumes:
      - data-volume:/app/data
      - logs-volume:/app/logs
      - storage-volume:/app/storage
      - ./data/analisis:/app/data/analisis
    depends_on:
      - redis
      - db # Add dependency on PostgreSQL
    restart: unless-stopped
    environment: # Pass PostgreSQL connection details to the bot
      POSTGRES_HOST: db # Service name of the PostgreSQL container
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
  # Secrets (store in .env, do NOT commit):
  # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  # TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    networks:
      - bot_network

  web:
    container_name: itbot_web
    build: .
    command: python web/app.py
    env_file:
      - .env
    volumes:
      - data-volume:/app/data
      - logs-volume:/app/logs
      - storage-volume:/app/storage
      - ./data/analisis:/app/data/analisis
      - ./data/dynamic_system:/app/data/dynamic_system
      - ./assets:/app/assets:ro
    depends_on:
      - redis
      - db
      - listener
      - bot
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      WEB_HOST: "${WEB_HOST:-0.0.0.0}"
      WEB_PORT: "${WEB_PORT:-8080}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-itbot-web-secret-2024}"
      FLASK_DEBUG: "${FLASK_DEBUG:-false}"
      # Ruta opcional a un banner para mostrar en el panel web (/app/...) 
      BANNER_IMAGE_PATH: "/app/assets/logo.png"
    networks:
      - bot_network

volumes:
  redis-data:
  postgres_data: # New volume for PostgreSQL data
  data-volume:
  logs-volume:
  storage-volume:

networks:
  bot_network:
    driver: bridge

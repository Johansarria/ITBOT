<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ITBOT Web Panel{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- jQuery (requerido por scripts del dashboard) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Chart.js (fijar versión compatible con zoom 1.4.2) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.4.2"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        :root {
            --itbot-primary: #00d4aa;
            --itbot-secondary: #1a1d29;
            --itbot-dark: #0d1117;
            --itbot-light: #f8f9fa;
        }
        
        body {
            background-color: var(--itbot-dark);
            color: var(--itbot-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar-brand {
            color: var(--itbot-primary) !important;
            font-weight: bold;
        }
        
        .card {
            background-color: var(--itbot-secondary);
            border: 1px solid #30363d;
            color: var(--itbot-light);
        }
        
        .btn-primary {
            background-color: var(--itbot-primary);
            border-color: var(--itbot-primary);
            color: var(--itbot-dark);
        }
        
        .btn-primary:hover {
            background-color: #00b597;
            border-color: #00b597;
        }
        
        .navbar {
            background-color: var(--itbot-secondary) !important;
        }
        
        .navbar-nav .nav-link {
            color: var(--itbot-light) !important;
        }
        
        .navbar-nav .nav-link:hover {
            color: var(--itbot-primary) !important;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
        
        .metric-card {
            transition: transform 0.2s;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
        }
        .metric-card .card-body {
            padding: 1rem 1.25rem;
        }
        .gap-3 { gap: 1rem !important; }
        
        .sidebar {
            background-color: var(--itbot-secondary);
            min-height: calc(100vh - 56px);
        }
        
        .table-dark {
            --bs-table-bg: var(--itbot-secondary);
        }
        
        .alert-success {
            background-color: rgba(40, 167, 69, 0.1);
            border-color: rgba(40, 167, 69, 0.5);
            color: #28a745;
        }
        
        .alert-warning {
            background-color: rgba(255, 193, 7, 0.1);
            border-color: rgba(255, 193, 7, 0.5);
            color: #ffc107;
        }
        
        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            border-color: rgba(220, 53, 69, 0.5);
            color: #dc3545;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('dashboard') }}?token={{ token }}">
                <img src="/assets/logo" alt="ITBOT" style="height:28px;width:28px;margin-right:8px;object-fit:contain;" onerror="fallbackLogo(this)" />
                ITBOT Web Panel
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}?token={{ token }}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('config_page') }}?token={{ token }}">
                            <i class="fas fa-cog"></i> Configuración
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('backtesting') }}?token={{ token }}">
                            <i class="fas fa-chart-line"></i> Backtesting
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user"></i> Panel
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="#" onclick="refreshData()"><i class="fas fa-sync"></i> Actualizar</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">ITBOT v2.0 - Sistema de Trading Dinámico</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Common JavaScript -->
    <script>
        // Socket.IO connection
        const socket = io();
        
        // Token para las API calls
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // Función para formatear números
        function formatNumber(num, decimals = 2) {
            return parseFloat(num).toFixed(decimals);
        }
        
        // Función para formatear porcentajes
        function formatPercent(num, decimals = 2) {
            const formatted = formatNumber(num, decimals);
            return `${num >= 0 ? '+' : ''}${formatted}%`;
        }
        
        // Función para actualizar datos
        function refreshData() {
            location.reload();
        }
        
        // Mostrar notificaciones
        function showNotification(message, type = 'info') {
            const alertClass = type === 'error' ? 'alert-danger' : 
                             type === 'success' ? 'alert-success' : 
                             type === 'warning' ? 'alert-warning' : 'alert-info';
            
            const alert = $(`
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `);
            
            $('#notifications').append(alert);
            
            // Auto dismiss after 5 seconds
            setTimeout(() => {
                alert.alert('close');
            }, 5000);
        }
        
        // Socket.IO event handlers
        socket.on('connect', function() {
            console.log('Connected to server');
        });
        
        socket.on('disconnect', function() {
            console.log('Disconnected from server');
            showNotification('Conexión perdida con el servidor', 'warning');
        });
        
        socket.on('status_update', function(data) {
            console.log('Status update received:', data);
            updateDashboard(data);
        });
        
        socket.on('error', function(data) {
            console.error('Socket error:', data);
            showNotification('Error: ' + data.message, 'error');
        });
        
        // Update dashboard with new data
        function updateDashboard(data) {
            // This will be implemented by each page
            if (typeof handleStatusUpdate === 'function') {
                handleStatusUpdate(data);
            }
        }

        // Fallback para el logo cuando /assets/logo no existe
        function fallbackLogo(img) {
            img.onerror = null;
            img.src = "{{ url_for('static', filename='img/logo.svg') }}";
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
